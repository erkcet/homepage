- Steam:
    - Recently Played:
        icon: steam.svg
        href: https://steamcommunity.com/profiles/76561198321105804
        description: Recently played games
        widget:
          type: customapi
          url: "https://api.steampowered.com/IPlayerService/GetRecentlyPlayedGames/v1/?key=AB0D2F20D12628EE40A0D09B0B2A2144&steamid=76561198321105804&count=5"
          refreshInterval: 300000
          display: dynamic-list
          mappings:
            items: response.games
            name: name
            label: playtime_2weeks
            format: number
            suffix: " min"
            limit: 5
            target: "https://store.steampowered.com/app/{appid}"
    - Steam Level:
        icon: steam.svg
        href: https://steamcommunity.com/profiles/76561198321105804
        description: Profile level
        widget:
          type: customapi
          url: "https://api.steampowered.com/IPlayerService/GetSteamLevel/v1/?key=AB0D2F20D12628EE40A0D09B0B2A2144&steamid=76561198321105804"
          refreshInterval: 3600000
          mappings:
            - field: response.player_level
              label: Level
              format: number
    - Game Library:
        icon: steam.svg
        href: https://steamcommunity.com/profiles/76561198321105804/games
        description: Owned games
        widget:
          type: customapi
          url: "https://api.steampowered.com/IPlayerService/GetOwnedGames/v1/?key=AB0D2F20D12628EE40A0D09B0B2A2144&steamid=76561198321105804&include_played_free_games=1"
          refreshInterval: 3600000
          mappings:
            - field: response.game_count
              label: Games Owned
              format: number
- Gaming:
    - Top Deals:
        icon: mdi-tag-multiple
        href: https://www.cheapshark.com/browse/deals
        description: Best game deals right now
        widget:
          type: customapi
          url: "https://www.cheapshark.com/api/1.0/deals?storeID=1&upperPrice=15&pageSize=5&sortBy=Deal%20Rating"
          refreshInterval: 3600000
          display: dynamic-list
          mappings:
            name: title
            label: salePrice
            format: text
            prefix: "$"
            limit: 5
            target: "https://www.cheapshark.com/redirect?dealID={dealID}"
    - Free Games:
        icon: mdi-gift
        href: https://www.gamerpower.com/giveaways
        description: Free game giveaways
        widget:
          type: customapi
          url: "https://www.gamerpower.com/api/giveaways?type=game&sort-by=date"
          refreshInterval: 3600000
          display: dynamic-list
          mappings:
            name: title
            label: worth
            format: text
            limit: 5
            target: "{open_giveaway_url}"
    - CS2 News:
        icon: si-counterstrike
        href: https://store.steampowered.com/news/app/730
        description: Latest CS2 updates
        widget:
          type: customapi
          url: "https://api.steampowered.com/ISteamNews/GetNewsForApp/v2/?appid=730&count=5&feeds=steam_community_announcements"
          refreshInterval: 1800000
          display: dynamic-list
          mappings:
            items: appnews.newsitems
            name: title
            label: feedlabel
            format: text
            limit: 5
            target: "{url}"
    - Top Rated Deals:
        icon: mdi-star
        href: https://www.cheapshark.com/browse/deals
        description: Highest rated on sale
        widget:
          type: customapi
          url: "https://www.cheapshark.com/api/1.0/deals?storeID=1&upperPrice=15&pageSize=5&sortBy=Metacritic"
          refreshInterval: 3600000
          display: dynamic-list
          mappings:
            name: title
            label: salePrice
            format: text
            prefix: "$"
            limit: 5
            target: "https://www.cheapshark.com/redirect?dealID={dealID}"
